name: Test and publish

# Every push to main runs the tests and builds the package, then publishes it; a version that is
# already on PyPI is skipped, so a release is: python scripts/bump_version.py X.Y.Z,
# commit, push to main. Pushing a tag vX.Y.Z works the same way.
# Uses PyPI trusted publishing: pypi.org trusts this workflow, so no API token is stored anywhere.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import kompactor; print(kompactor.__version__)")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the package version $version"
            exit 1
          fi
      - name: Build
        # into pkg/, not dist/: dist/ is where build-vsix.sh writes the VS Code extension file
        run: |
          python -m pip install --upgrade build
          python -m build --outdir pkg
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pkg/
          skip-existing: true
