[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kompactor"
version = "0.7.7"
description = "Cut the tokens Claude Code spends on noise: compacted command output (failing runs included), outline-first reads, a local code graph, and per-turn savings."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["claude", "claude-code", "tokens", "context", "llm", "compaction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/amarkum/kompactor"
Evidence = "https://github.com/amarkum/kompactor/blob/main/evidence/REPORT.md"
Issues = "https://github.com/amarkum/kompactor/issues"

[project.optional-dependencies]
exact = ["tiktoken>=0.7"]

[project.scripts]
kompactor = "kompactor.cli:main"

[tool.setuptools]
packages = ["kompactor", "kompactor.static", "kompactor.static.fonts"]

[tool.setuptools.package-data]
kompactor = ["ui.html"]
"kompactor.static" = ["*.html", "*.svg"]
"kompactor.static.fonts" = ["*.woff2", "*.txt"]
