[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kompactor"
version = "0.8.7"
description = "Cut the tokens Claude Code spends on noise: compacted command output (failing runs included), outline-first reads, a local code graph, and per-turn savings."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["claude", "claude-code", "claude-code-plugin", "anthropic", "ai-coding", "llm", "tokens", "token-optimization", "context-window", "cost-optimization", "developer-tools", "hooks", "code-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Plugins",
]

[project.urls]
Homepage = "https://github.com/amarkum/kompactor"
Documentation = "https://github.com/amarkum/kompactor#readme"
Changelog = "https://github.com/amarkum/kompactor/blob/main/CHANGELOG.md"
Evidence = "https://github.com/amarkum/kompactor/blob/main/evidence/REPORT.md"
Issues = "https://github.com/amarkum/kompactor/issues"

[project.optional-dependencies]
exact = ["tiktoken>=0.7"]

[project.scripts]
kompactor = "kompactor.cli:main"

[tool.setuptools]
packages = ["kompactor", "kompactor.static", "kompactor.static.fonts", "kompactor.vsix"]

[tool.setuptools.package-data]
kompactor = ["ui.html"]
"kompactor.static" = ["*.html", "*.svg", "*.json"]
"kompactor.static.fonts" = ["*.woff2", "*.txt"]
"kompactor.vsix" = ["*.vsix"]
