[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kompactor"
version = "0.4.1"
description = "Cut the tokens Claude Code spends on noise: compacted command output (failing runs included), outline-first reads, a local code graph, and per-turn savings."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
exact = ["tiktoken>=0.7"]

[project.scripts]
kompactor = "kompactor.cli:main"

[tool.setuptools]
packages = ["kompactor"]

[tool.setuptools.package-data]
kompactor = ["ui.html", "static/*", "static/fonts/*"]
